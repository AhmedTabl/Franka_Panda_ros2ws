# Single source of truth for the surgical hand joint set.
#
# Consumed by:
#   - robots/surgical_hand.ros2_control.xacro (generates the ros2_control block)
#   - surgical_hand_bringup launch files (generates the controller joint list)
#   - surgical_hand_skills (maps named poses onto the command vector)
#
# The command vector ordering used everywhere is the order of this list.
#
# Current model: ORCA hand v2 (right) placeholder, until the custom 3-finger
# CAD/URDF exists. Joint names are the auto-generated CAD names from
# orcahand_description/v2/models/urdf/orcahand_right.urdf. The `alias` field
# is the stable semantic name the rest of the stack should use; when the
# custom hand replaces the placeholder, only `name` fields (and limits)
# should need to change.
#
# Ring vs middle disambiguation of the two "M-" chains was done from mount
# origins on R-Carpals (x: pinky +0.036 > ring +0.015 > middle -0.006 > index -0.027).
#
# lower/upper are radians, copied from the URDF <limit> tags.
# initial_position is the startup/neutral pose (used as mock-hardware initial
# state and as the fill value for joints a named pose does not specify).

joints:

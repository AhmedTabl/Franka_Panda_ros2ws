# MuJoCo server + controller configuration for the hand-only simulation.
# Mirrors the pattern of franka_bringup's single_sim_controllers.yaml: the
# controller_manager runs INSIDE the mujoco_server process via the
# mujoco_ros2_control plugin, so this one file parameterizes both.
#
# The hand_joint_position_controller `joints` list is injected at launch
# time from surgical_hand_description/config/hand_joints.yaml (single
# source of truth) — see surgical_hand_mujoco.launch.py.

mujoco_server:
  ros__parameters:
    MujocoPlugins:
      names:
        - mujoco_ros2_control
      mujoco_ros2_control:
        type: mujoco_ros2_control::MujocoRos2ControlPlugin
        hardware:
          type: mujoco_ros_control/RobotHW
          control_period: 0.001
        params:
          namespace: ""
          robot_description_node: "robot_state_publisher"
          robot_description: "robot_description"

controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hand_joint_position_controller:
      type: forward_command_controller/ForwardCommandController

hand_joint_position_controller:
  ros__parameters:
    interface_name: position
